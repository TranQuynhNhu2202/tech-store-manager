{% extends 'dashboard/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">{{ title }}</h4>
    <a href="{% url 'dashboard_home' %}" class="btn btn-light border rounded-3">
        <i class="bi bi-arrow-left"></i> Quay lại
    </a>
</div>

<div class="custom-card" style="max-width: 750px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Tên sản phẩm</label>
            <input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" placeholder="Nhập tên sản phẩm..." required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Danh mục</label>
                <select name="category" class="form-select" required>
                    <option value="">-- Chọn danh mục --</option>
                    {% for c in categories %}
                        <option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>
                            {{ c.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Số lượng tồn kho</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock|default:0 }}" min="0" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Giá bán (VNĐ)</label>
                <input type="number" name="price" class="form-control" value="{{ product.price|floatformat:0|default:'' }}" placeholder="VD: 15000000" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Giá nhập (VNĐ)</label>
                <input type="number" name="cost_price" class="form-control" value="{{ product.cost_price|floatformat:0|default:'' }}" placeholder="VD: 12000000" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Ảnh sản phẩm</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            {% if product.image %}
                <small class="text-muted">Ảnh hiện tại: {{ product.image }}</small>
            {% endif %}
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Mô tả chi tiết</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Thông số kỹ thuật, bảo hành...">{{ product.description|default:'' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 rounded-3">
            <i class="bi bi-save"></i> Lưu thông tin
        </button>
    </form>
</div>
{% endblock %}
