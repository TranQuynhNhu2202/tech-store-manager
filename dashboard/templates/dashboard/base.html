<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Cửa hàng Điện tử</title>
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Sidebar xanh đậm giống mẫu */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #1e293b;
            color: #cbd5e1;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 15px;
        }
        .sidebar .brand {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link {
            color: #cbd5e1;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }
        .sidebar .nav-link.active {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        /* Nội dung chính bên phải */
        .main-content {
            margin-left: 250px;
            min-height: 100vh;
        }
        .topbar {
            background-color: #ffffff;
            padding: 15px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .custom-card {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            padding: 20px;
        }
        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <i class="bi bi-cpu-fill text-primary"></i> ElectroAdmin
        </div>
        <nav class="nav flex-column">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}" href="{% url 'dashboard_home' %}">
                <i class="bi bi-house-door-fill"></i> Tổng quan
            </a>
            <a class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'product_list' %}">
                <i class="bi bi-box-seam"></i> Sản phẩm
            </a>
            <a class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'order_list' %}">
                <i class="bi bi-cart-check"></i> Đơn hàng
            </a>
            <a class="nav-link {% if request.resolver_match.url_name == 'customer_list' %}active{% endif %}" href="{% url 'customer_list' %}">
                <i class="bi bi-people"></i> Khách hàng
            </a>
            <a class="nav-link {% if request.resolver_match.url_name == 'report_view' %}active{% endif %}" href="{% url 'report_view' %}">
                <i class="bi bi-bar-chart-line"></i> Báo cáo
            </a>
            <a class="nav-link {% if request.resolver_match.url_name == 'settings_view' %}active{% endif %}" href="{% url 'settings_view' %}">
                <i class="bi bi-gear"></i> Cài đặt
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <div class="topbar">
            <div class="input-group" style="max-width: 350px;">
                <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="Tìm kiếm sản phẩm, đơn hàng...">
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light rounded-circle position-relative">
                    <i class="bi bi-bell"></i>
                </button>
                <div class="d-flex align-items-center gap-2">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2563eb&color=fff" class="rounded-circle" width="38" height="38" alt="Admin">
                    <span class="fw-semibold small">Quản trị viên</span>
                </div>
            </div>
        </div>

        <!-- Nội dung từng trang con -->
        <div class="p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
